spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/curso-service-grupo2/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[1].id=matricula-service-grupo2
